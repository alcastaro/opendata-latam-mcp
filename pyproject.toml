[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendata-latam-mcp"
version = "0.2.0"
description = "MCP server unifying Latin American open government data portals (CKAN, Socrata) under one interface."
readme = "README.md"
requires-python = ">=3.10"
# SPDX string rather than the deprecated `{ text = "MIT" }` table, so the wheel
# carries License-Expression, which is what PyPI reads now.
license = "MIT"
license-files = ["LICENSE"]
# Attribution, not ownership transfer. The package and the registry namespace
# stay under the personal account for continuity with dominican-open-data-mcp,
# already published under io.github.alcastaro. OLDS is named because the
# connector's purpose and the observatory's purpose are the same one, and
# because whoever reads a PyPI page asks who publishes it.
authors = [
    { name = "Alberto Castillo Aroca", email = "ai@olds2030.org" },
]
maintainers = [
    { name = "OLDS — Observatorio Latinoamericano de Desarrollo Sostenible", email = "ai@olds2030.org" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "open-data",
    "datos-abiertos",
    "latin-america",
    "america-latina",
    "ckan",
    "socrata",
    "civic-tech",
    "gobierno-abierto",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # 3.13 verified by installing the wheel into a clean 3.13 environment and
    # listing the tools, not assumed from requires-python.
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # v2 of the SDK. The upper bound stays because 2.0 is the precedent: it
    # renamed FastMCP to MCPServer and left `mcp.server.fastmcp` as a stub that
    # raises on import. A major bump can do that again, and without a bound a
    # fresh `uvx opendata-latam-mcp` would resolve it and die on first import.
    # The lockfile protects this checkout, not anyone installing from PyPI.
    "mcp>=2.1,<3",
    "httpx>=0.27",
    # datos.gob.mx ships an incomplete TLS chain that certifi cannot verify;
    # truststore reads the system trust store instead. Applied at the CKAN
    # client level, so every portal benefits.
    "truststore>=0.10; python_version >= '3.10'",
]
# Deliberately NOT declared: openpyxl, duckdb, chardet, odfpy. They belong to
# the file download-and-parse path, which this package does not have yet — they
# were carried over from the initial scaffold and nothing in src/ imports them.
# When that path arrives it arrives through the imported country packages.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
opendata-latam-mcp = "opendata_latam_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alcastaro/opendata-latam-mcp"
Repository = "https://github.com/alcastaro/opendata-latam-mcp"
Issues = "https://github.com/alcastaro/opendata-latam-mcp/issues"
Changelog = "https://github.com/alcastaro/opendata-latam-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_latam_mcp"]
# PEP 561 marker. Without it the annotations do not travel, and this package is
# meant to be imported by others.
artifacts = ["src/opendata_latam_mcp/py.typed"]

# The sdist is an INCLUDE list, never an exclude list. `uv build` with hatchling
# does NOT respect nested .gitignore files: measured 2026-08-30, it packaged
# .code-review-graph/graph.db — 864 KB, 84% of the artifact, carrying 4,226
# absolute paths from the developer's home directory — a file git had never
# tracked, protected only by a nested .gitignore that the packer never reads.
# The sibling Dominican project shipped the same class of file for the same
# reason. An exclude list only ever blocks the leak you already know about;
# the next local tool will use a different directory name. CI asserts this
# contents list on every run, because the rule was written down once already
# and still fired.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "README.md",
    "README.es.md",
    "LICENSE",
    "server.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "S", "BLE", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is how tests assert
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes on purpose: the whole point of several of
# them is asserting how the server is wired, not just how it behaves.
"tests/*" = ["S105", "S106", "SLF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits real LatAm gov data portals (skipped by default)",
]
