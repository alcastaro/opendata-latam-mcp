[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendata-latam-mcp"
version = "0.1.0"
description = "MCP server unifying Latin American open government data portals (CKAN, Socrata) under one interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Castillo Aroca" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "open-data",
    "datos-abiertos",
    "latin-america",
    "america-latina",
    "ckan",
    "socrata",
    "civic-tech",
    "gobierno-abierto",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "chardet>=5.2",
    "odfpy>=1.4",
    "truststore>=0.10; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
opendata-latam-mcp = "opendata_latam_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alcastaro/opendata-latam-mcp"
Repository = "https://github.com/alcastaro/opendata-latam-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_latam_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits real LatAm gov data portals (skipped by default)",
]
